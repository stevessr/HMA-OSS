name: SukiSU standalone experimental build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sukisu-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SukiSU APK + native backend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare stable public test signing
        run: |
          touch local.properties
          bash signing/verify-experimental-keystore.sh

      - name: Run fail-closed module regression tests
        run: bash sukisu/tests/static-checks.sh

      - name: Build manager APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK uses pinned experimental certificate
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          bash signing/verify-experimental-apk.sh "$apk"

      - name: Install pinned Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Build native injector and payload
        run: |
          cmake -S sukisu/native -B sukisu/native/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build sukisu/native/build --parallel 2

      - name: Validate shell scripts and standalone entry
        run: |
          bash sukisu/tests/static-checks.sh
          test -s sukisu/native/build/hma-injector
          test -s sukisu/native/build/libhma-payload.so

      - name: Package installable experimental module
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          python3 sukisu/tests/verify-apk.py "$apk"
          bash sukisu/package.sh "$apk" sukisu/native/build sukisu/build/HMA-OSS-SukiSU-experimental.zip
          unzip -l sukisu/build/HMA-OSS-SukiSU-experimental.zip | tee sukisu/build/package-manifest.txt
          unzip -tqq sukisu/build/HMA-OSS-SukiSU-experimental.zip
          for entry in manager.apk bin/hma-injector lib/libhma-payload.so module.prop skip_mount action.sh service.sh state.sh try-inject.sh customize.sh legacy-cleanup.sh uninstall.sh; do
            unzip -Z1 sukisu/build/HMA-OSS-SukiSU-experimental.zip | grep -qx "$entry"
          done

      - name: Upload installable SukiSU module ZIP directly (no outer ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: sukisu/build/HMA-OSS-SukiSU-experimental.zip
          archive: false
          if-no-files-found: error
