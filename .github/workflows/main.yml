name: Main

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue.yml'
      - '.github/workflows/pull_request.yml'
      - 'fastlane/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Xposed APK (no Zygisk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Write signing and Crowdin settings
        if: github.ref == 'refs/heads/master'
        run: |
          echo officialBuild=true >> local.properties
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.ALIAS_KEY_PASSWORD }}' >> local.properties
          echo fileDir=`pwd`/key.jks >> local.properties
          echo crowdinProjectId='${{ secrets.CROWDIN_PROJECT_ID }}' >> local.properties
          echo crowdinApiKey='${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}' >> local.properties
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > key.jks

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK variants
        run: ./gradlew :app:assemble --stacktrace

      - name: Determine release version
        id: package
        shell: bash
        run: |
          file="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$file"
          name="$(basename "$file")"
          version="${name#HMA-OSS-}"
          version="${version%-release.apk}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK mappings
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-mappings
          path: app/build/outputs/mapping/release/

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.package.outputs.version }}
          tag_name: ${{ steps.package.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/src/main/assets/translators.json
