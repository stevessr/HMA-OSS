name: Main

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare stable public test signing
        run: |
          touch local.properties
          bash signing/verify-experimental-keystore.sh
      - name: Build the standalone manager APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK uses pinned experimental certificate
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          bash signing/verify-experimental-apk.sh "$apk"
      - name: Upload APK for development
        uses: actions/upload-artifact@v7
        with:
          name: hma-manager-experimental
          path: app/build/outputs/apk/debug/*.apk
