name: Main

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue.yml'
      - '.github/workflows/pull_request.yml'
      - 'fastlane/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Xposed APK (no Zygisk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare build environment
        shell: bash
        run: |
          touch local.properties
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure official signing (when provisioned)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_STORE }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_KEY_PASSWORD }}
          CROWDIN_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
            {
              echo "officialBuild=true"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$ALIAS_PASSWORD"
              echo "fileDir=$PWD/key.jks"
            } >> local.properties
          fi
          {
            echo "crowdinProjectId=$CROWDIN_ID"
            echo "crowdinApiKey=$CROWDIN_TOKEN"
          } >> local.properties

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK variants
        run: ./gradlew :app:assemble --stacktrace

      - name: Determine release version
        id: package
        shell: bash
        run: |
          file="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$file"
          name="$(basename "$file")"
          version="${name#HMA-OSS-}"
          version="${version%-release.apk}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK mappings
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-mappings
          path: app/build/outputs/mapping/release/

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.package.outputs.version }}
          tag_name: ${{ steps.package.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/src/main/assets/translators.json
