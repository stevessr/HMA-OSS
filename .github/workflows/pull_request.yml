name: Pull Request

on: pull_request

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate SukiSU package scripts
        run: |
          for f in sukisu/module/*.sh; do sh -n "$f"; done
          bash -n sukisu/package.sh
          grep -q '^id=hma_sukisu$' sukisu/module/module.prop
          test -f sukisu/native/injector.cpp
          test -f sukisu/native/payload.cpp
