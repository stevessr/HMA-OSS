name: Pull Request

on: pull_request

jobs:
  build:
    name: Build Xposed APK (no Zygisk)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.config/.android
          ln -s ~/.config/.android ~/.android
          if [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkey -keystore ~/.config/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.config/.android/debug.keystore
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Xposed manifest and init entry
        run: |
          grep -q 'xposedmodule' app/src/main/AndroidManifest.xml
          grep -q 'xposedscope' app/src/main/AndroidManifest.xml
          grep -qx 'org.frknkrc44.hma_oss.zygote.ZygoteEntry' app/src/main/assets/xposed_init
          ! grep -qi 'ZygoteLoader' app/build.gradle.kts
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" assets/xposed_init | grep -qx 'org.frknkrc44.hma_oss.zygote.ZygoteEntry'

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HMA-OSS-Xposed-debug
          path: app/build/outputs/apk/debug/*.apk
